<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Media Reactive Engine — Regia</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="regia-page">
  <header class="topbar">
    <div>
      <strong>MEDIA REACTIVE ENGINE</strong>
      <span class="muted">REGIA</span>
    </div>
    <a href="/output" target="_blank">APRI OUTPUT ↗</a>
  </header>

  <main class="mixer">
    <section class="panel library-panel">
      <div class="panel-title">MEDIATECA</div>
      <div id="library-status" class="muted">Caricamento…</div>
      <div id="folders"></div>
    </section>

    <section class="panel deck-panel">
      <div class="panel-title">DECK A</div>

      <div id="preview" class="preview">
        <span class="muted">Seleziona un media</span>
      </div>

      <div class="controls">
        <label>
          OPACITY
          <input id="opacity" type="range" min="0" max="1" step="0.01" value="1">
        </label>

        <label>
          SCALE
          <input id="scale" type="range" min="0.5" max="2.5" step="0.01" value="1">
        </label>

        <label>
          SPEED
          <input id="speed" type="range" min="0.2" max="3" step="0.05" value="1">
        </label>

        <label>
          REACTIVITY
          <input id="reactivity" type="range" min="0" max="1" step="0.01" value="0.5">
        </label>
      </div>

      <div class="button-row">
        <button id="play-toggle">PAUSE</button>
        <button id="random">RANDOM</button>
        <button id="blackout">BLACKOUT</button>
      </div>

      <div class="now-playing">
        <span class="muted">NOW PLAYING</span>
        <strong id="now-playing">—</strong>
      </div>
    </section>
  </main>

  <script src="/static/regia.js"></script>
</body>
</html>
