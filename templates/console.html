<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>magic-mic — Console</title><link rel="stylesheet" href="/static/console.css"></head><body>
<header class="console-topbar"><div class="brand"><strong>magic-mic</strong><span>DJ + VJ PERFORMANCE CONSOLE</span></div><div class="media-root-control"><span class="label">MEDIA COLLECTION</span><strong id="media-root">loading…</strong><div class="preset-control"><select id="preset-select"><option value="">PRESET</option></select><button id="preset-load">LOAD</button><button id="preset-save">SAVE</button></div><button id="choose-folder">CHOOSE COLLECTION</button><button id="reload-all">RESCAN</button></div><div class="layout-controls"><a href="/output" target="_blank">OUTPUT ↗</a></div></header>
<main class="performance-console">
<section class="library-column visual-library"><button id="choose-visual-root" class="column-head library-root-button"><span>VIDEO FOLDERS</span><span id="visual-root-label">CHANGE ↗</span></button><div class="frame-crop visual-library-crop"><iframe id="vj-library-frame" src="/regia"></iframe></div></section>
<section class="machine-column video-machine"><div class="machine-head"><strong>VIDEO</strong><span>DECK A / DECK B</span></div><iframe id="vj-frame" src="/regia"></iframe></section>
<section class="library-column audio-library"><button id="choose-audio-root" class="column-head library-root-button"><span>AUDIO FOLDERS</span><span id="audio-root-label">CHANGE ↗</span></button><div class="frame-crop audio-library-crop"><iframe id="dj-library-frame" src="/dj"></iframe></div></section>
<section class="machine-column audio-machine"><div class="machine-head"><strong>AUDIO</strong><span>DECK A / DECK B</span></div><iframe id="dj-frame" src="/dj"></iframe></section>
<footer class="master-console">
<section class="master-block video-master"><div class="master-title master-title-row"><span>VIDEO MASTER</span><button id="reset-video-fx" type="button">RESET</button></div><div class="footer-ab-mixer"><span>A</span><input id="footer-video-crossfader" data-midi-param="video.crossfader" type="range" min="0" max="1" step=".001" value="0"><span>B</span></div><div class="preview-shell"><iframe id="output-frame" src="/output"></iframe></div><div class="video-master-controls"><label class="fx-ar-control"><span>BRIGHTNESS <small><input id="ar-master-brightness" type="checkbox"> AR</small></span><input id="video-master-brightness" type="range" min=".2" max="2" step=".01" value="1"></label><label class="fx-ar-control"><span>CONTRAST <small><input id="ar-master-contrast" type="checkbox"> AR</small></span><input id="video-master-contrast" type="range" min=".2" max="2.5" step=".01" value="1"></label><label class="fx-ar-control"><span>BLUR <small><input id="ar-master-blur" type="checkbox"> AR</small></span><input id="video-master-blur" type="range" min="0" max="18" step=".1" value="0"></label><label class="fx-ar-control"><span>GLITCH <small><input id="ar-fx-glitch" type="checkbox"> AR</small></span><input id="fx-glitch" data-midi-param="video.glitch" type="range" min="0" max="1" step=".01" value="0"></label><label class="fx-ar-control"><span>RGB SPLIT <small><input id="ar-fx-rgb" type="checkbox"> AR</small></span><input id="fx-rgb" data-midi-param="video.rgb" type="range" min="0" max="1" step=".01" value="0"></label><label class="fx-ar-control"><span>INVERT <small><input id="ar-fx-invert" type="checkbox"> AR</small></span><input id="fx-invert" data-midi-param="video.invert" type="range" min="0" max="1" step=".01" value="0"></label></div><label class="final-master-fader">VIDEO MASTER <input id="video-master-opacity" data-midi-param="video.master" type="range" min="0" max="1" step=".01" value="1"></label></section>
<section class="master-block global-master"><div class="master-title master-title-row"><span>MASTER GENERALE / AUDIO → VIDEO</span><button id="reset-fx" type="button">RESET FX</button></div><div class="audio-meter-preview center-audio-preview"><div><span>LEVEL</span><i id="master-meter-level"></i></div><div><span>BASS</span><i id="master-meter-bass"></i></div><div><span>MID</span><i id="master-meter-mid"></i></div><div><span>HIGH</span><i id="master-meter-high"></i></div><b id="master-beat-indicator">BEAT</b></div><div class="common-macro-grid"><label>INTENSITY <input id="common-intensity" type="range" min="0" max="1" step=".01" value="0"></label><label>FILTER <input id="common-filter" type="range" min="-1" max="1" step=".01" value="0"></label><label>PULSE <input id="common-pulse" type="range" min="0" max="1" step=".01" value="0"></label><label>STROBE <input id="common-strobe" type="range" min="0" max="1" step=".01" value="0"></label></div><div class="master-readout"><span>SHARED AUDIO + VIDEO CONTROL BUS</span><strong>READY FOR MIDI CC MAPPING</strong></div><label class="final-master-fader general-final">GENERAL MASTER <input id="general-master-volume" data-midi-param="common.master" type="range" min="0" max="1" step=".01" value="1"></label></section>
<section class="master-block audio-master"><div class="master-title">AUDIO MASTER</div><div class="footer-ab-mixer"><span>A</span><input id="footer-audio-crossfader" data-midi-param="audio.crossfader" type="range" min="0" max="1" step=".001" value=".5"><span>B</span></div><div class="audio-master-grid"><button id="mic-toggle">MIC OFF</button><label>MIC GAIN <input id="mic-gain" type="range" min="0" max="2" step=".01" value="1"></label><label class="toggle-line"><input id="mic-monitor" type="checkbox"> MONITOR MIC</label><button id="record-toggle">REC</button><span id="record-status">READY</span></div><label class="final-master-fader">AUDIO MASTER <input id="console-master-volume" data-midi-param="audio.master" type="range" min="0" max="1.2" step=".01" value="1"></label></section>
</footer></main><div id="folder-status" class="folder-status hidden"></div><script src="/static/console.js"></script></body></html>
