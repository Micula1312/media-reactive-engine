<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Media Reactive Engine — Console</title>
  <link rel="stylesheet" href="/static/console.css">
</head>
<body>
  <header class="console-topbar">
    <div class="brand"><strong>MEDIA REACTIVE ENGINE</strong><span>DJ + VJ PERFORMANCE CONSOLE</span></div>
    <div class="media-root-control"><span class="label">MEDIA ROOT</span><strong id="media-root">loading…</strong><button id="choose-folder">CHOOSE FOLDER</button><button id="reload-all">RESCAN</button></div>
    <div class="layout-controls"><a href="/output" target="_blank">OUTPUT ↗</a></div>
  </header>

  <main class="performance-console">
    <section class="library-column visual-library"><div class="column-head">VISUAL FOLDERS</div><div class="frame-crop visual-library-crop"><iframe id="vj-library-frame" src="/regia" title="Visual media library"></iframe></div></section>

    <section class="machine-column video-machine"><div class="machine-head"><strong>VIDEO</strong><span>DECK A / DECK B</span></div><iframe id="vj-frame" src="/regia" title="Video mixer"></iframe></section>

    <section class="library-column audio-library"><div class="column-head">AUDIO FOLDERS</div><div class="frame-crop audio-library-crop"><iframe id="dj-library-frame" src="/dj" title="Audio media library"></iframe></div></section>

    <section class="machine-column audio-machine"><div class="machine-head"><strong>AUDIO</strong><span>DECK A / DECK B</span></div><iframe id="dj-frame" src="/dj" title="DJ mixer"></iframe></section>

    <footer class="master-console">
      <section class="master-block video-master">
        <div class="master-title">VIDEO MASTER</div>
        <div class="preview-shell"><iframe id="output-frame" src="/output" title="Live output"></iframe></div>
        <div class="master-actions"><a class="master-action" href="/output" target="_blank">FULLSCREEN OUTPUT ↗</a></div>
      </section>

      <section class="master-block global-master">
        <div class="master-title">MASTER GENERALE</div>
        <div class="master-readout"><span>DJ → AUDIO ANALYSIS → VJ</span><strong>LEVEL / BASS / MID / HIGH / BEAT</strong></div>
      </section>

      <section class="master-block audio-master">
        <div class="master-title">AUDIO MASTER</div>
        <div class="audio-master-grid">
          <label>MASTER <input id="console-master-volume" type="range" min="0" max="1.2" step=".01" value="1"></label>
          <button id="mic-toggle">MIC OFF</button>
          <label>MIC GAIN <input id="mic-gain" type="range" min="0" max="2" step=".01" value="1"></label>
          <label class="toggle-line"><input id="mic-monitor" type="checkbox"> MONITOR MIC</label>
          <button id="record-toggle" class="record-button">REC</button>
          <span id="record-status">READY</span>
        </div>
      </section>
    </footer>
  </main>

  <div id="folder-status" class="folder-status hidden"></div>
  <script src="/static/console.js"></script>
</body>
</html>
