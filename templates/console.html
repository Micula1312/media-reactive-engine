<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Media Reactive Engine — Console</title>
  <link rel="stylesheet" href="/static/console.css">
</head>
<body>
  <header class="console-topbar">
    <div class="brand"><strong>MEDIA REACTIVE ENGINE</strong><span>DJ + VJ PERFORMANCE CONSOLE</span></div>
    <div class="media-root-control"><span class="label">MEDIA COLLECTION</span><strong id="media-root">loading…</strong><button id="choose-folder">CHOOSE COLLECTION</button><button id="reload-all">RESCAN</button></div>
    <div class="layout-controls"><a href="/output" target="_blank">OUTPUT ↗</a></div>
  </header>

  <main class="performance-console">
    <section class="library-column visual-library">
      <button id="choose-visual-root" class="column-head library-root-button" title="Choose visual library folder">
        <span>VISUAL FOLDERS</span><span id="visual-root-label">CHANGE ↗</span>
      </button>
      <div class="frame-crop visual-library-crop"><iframe id="vj-library-frame" src="/regia" title="Visual media library"></iframe></div>
    </section>

    <section class="machine-column video-machine"><div class="machine-head"><strong>VIDEO</strong><span>DECK A / DECK B</span></div><iframe id="vj-frame" src="/regia" title="Video mixer"></iframe></section>

    <section class="library-column audio-library">
      <button id="choose-audio-root" class="column-head library-root-button" title="Choose audio library folder">
        <span>AUDIO FOLDERS</span><span id="audio-root-label">CHANGE ↗</span>
      </button>
      <div class="frame-crop audio-library-crop"><iframe id="dj-library-frame" src="/dj" title="Audio media library"></iframe></div>
    </section>

    <section class="machine-column audio-machine"><div class="machine-head"><strong>AUDIO</strong><span>DECK A / DECK B</span></div><iframe id="dj-frame" src="/dj" title="DJ mixer"></iframe></section>

    <footer class="master-console">
      <section class="master-block video-master">
        <div class="master-title">VIDEO MASTER</div>
        <div class="preview-shell"><iframe id="output-frame" src="/output" title="Live output"></iframe></div>
        <div class="video-master-controls">
          <label>OPACITY <input id="video-master-opacity" data-midi-param="video.opacity" type="range" min="0" max="1" step=".01" value="1"></label>
          <label>BRIGHTNESS <input id="video-master-brightness" data-midi-param="video.brightness" type="range" min=".2" max="2" step=".01" value="1"></label>
          <label>CONTRAST <input id="video-master-contrast" data-midi-param="video.contrast" type="range" min=".2" max="2.5" step=".01" value="1"></label>
          <label>SATURATION <input id="video-master-saturation" data-midi-param="video.saturation" type="range" min="0" max="3" step=".01" value="1"></label>
          <label>HUE <input id="video-master-hue" data-midi-param="video.hue" type="range" min="-180" max="180" step="1" value="0"></label>
          <label>BLUR <input id="video-master-blur" data-midi-param="video.blur" type="range" min="0" max="18" step=".1" value="0"></label>
          <a class="master-action" href="/output" target="_blank">FULLSCREEN ↗</a>
        </div>
      </section>

      <section class="master-block global-master">
        <div class="master-title">MASTER GENERALE / MIDI MACROS</div>
        <div class="common-macro-grid">
          <label>INTENSITY <input id="common-intensity" data-midi-param="common.intensity" type="range" min="0" max="1" step=".01" value="0"></label>
          <label>FILTER <input id="common-filter" data-midi-param="common.filter" type="range" min="-1" max="1" step=".01" value="0"></label>
          <label>PULSE <input id="common-pulse" data-midi-param="common.pulse" type="range" min="0" max="1" step=".01" value="0"></label>
          <label>STROBE <input id="common-strobe" data-midi-param="common.strobe" type="range" min="0" max="1" step=".01" value="0"></label>
        </div>
        <div class="master-readout"><span>SHARED AUDIO + VIDEO CONTROL BUS</span><strong>READY FOR MIDI CC MAPPING</strong></div>
      </section>

      <section class="master-block audio-master">
        <div class="master-title">AUDIO MASTER</div>
        <div class="audio-master-grid">
          <label>MASTER <input id="console-master-volume" data-midi-param="audio.master" type="range" min="0" max="1.2" step=".01" value="1"></label>
          <button id="mic-toggle">MIC OFF</button>
          <label>MIC GAIN <input id="mic-gain" data-midi-param="audio.mic_gain" type="range" min="0" max="2" step=".01" value="1"></label>
          <label class="toggle-line"><input id="mic-monitor" type="checkbox"> MONITOR MIC</label>
          <button id="record-toggle" class="record-button">REC</button>
          <span id="record-status">READY</span>
        </div>
      </section>
    </footer>
  </main>

  <div id="folder-status" class="folder-status hidden"></div>
  <script src="/static/console.js"></script>
</body>
</html>
